name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee build-log.txt
        continue-on-error: true

      - name: Annotate build errors
        if: always()
        run: |
          # 把 gradle 的编译错误行转成 GitHub annotation，便于诊断
          while IFS= read -r line; do
            echo "$line" | grep -qE "^e: |error:|FAILED|What went wrong|Could not resolve|Unresolved reference" && echo "::error::${line}"
          done < build-log.txt
          echo "done"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MealRecorder-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
